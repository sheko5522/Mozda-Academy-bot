<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="UzChat - O'zbekistoning eng yaxshi video chat platformasi. Do'stlar toping, suhbat qurinng!" />
  <title>UzChat – O'zbekiston Video Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Telefon mockup ramkasi -->
  <div class="phone-mockup-wrapper">
    <div class="phone-mockup">
      <!-- Telefon tepasi: kamera notch -->
      <div class="phone-notch">
        <div class="phone-notch-cam"></div>
      </div>
      <!-- Ilova kontenti shu yerga tushadi -->
      <div class="phone-screen">
        <div id="app"></div>
      </div>
      <!-- Telefon pastki chiziq -->
      <div class="phone-home-bar"></div>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-content" class="modal-content"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/handlers.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/webrtc.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
